[project]
name = "is-it-a-smiski"
version = "0.1.0"
description = "A Flask API and ResNet50 classifier for Smiski photos"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "gunicorn==26.2.0",
    "pillow==13.0.0",
    "python-dotenv==1.2.4",
    "numpy==2.4.6",
    "onnxruntime==1.31.0",
]

[project.optional-dependencies]
training = [
    "aiohttp==3.14.5",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "onnx==1.23.2",
    "onnxscript==0.7.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["backend*", "scripts*"]
